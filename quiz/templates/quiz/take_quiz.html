{% extends 'quiz/base.html' %}
{% block content %}
<div class="card border-0 shadow-sm mx-auto" style="max-width: 800px;">
    <div class="card-header bg-white d-flex justify-content-between align-items-center py-3">
        <h5 class="mb-0 fw-bold">Python Quiz</h5>
        <div class="badge bg-danger fs-6 p-2" id="timer">Time Remaining: 02:00</div>
    </div>
    <div class="card-body p-4">
        <form id="quizForm" method="POST">
            {% csrf_token %}
            {% for q in questions %}
            <div class="mb-4">
                <p class="fw-semibold mb-2">{{ forloop.counter }}. {{ q.text }}</p>
                <div class="list-group">
                    <label class="list-group-item list-group-item-action">
                        <input class="form-check-input me-2" type="radio" name="question_{{ q.id }}" value="A"> {{ q.option_a }}
                    </label>
                    <label class="list-group-item list-group-item-action">
                        <input class="form-check-input me-2" type="radio" name="question_{{ q.id }}" value="B"> {{ q.option_b }}
                    </label>
                    <label class="list-group-item list-group-item-action">
                        <input class="form-check-input me-2" type="radio" name="question_{{ q.id }}" value="C"> {{ q.option_c }}
                    </label>
                    <label class="list-group-item list-group-item-action">
                        <input class="form-check-input me-2" type="radio" name="question_{{ q.id }}" value="D"> {{ q.option_d }}
                    </label>
                </div>
            </div>
            {% endfor %}
            <button type="submit" class="btn btn-primary w-100 py-2">Submit Answers</button>
        </form>
    </div>
</div>

<script>
    let timeLeft = {{ quiz_duration_seconds }};
    const timerElement = document.getElementById('timer');
    const form = document.getElementById('quizForm');

    const countdown = setInterval(() => {
        let minutes = Math.floor(timeLeft / 60);
        let seconds = timeLeft % 60;
        timerElement.textContent = `Time Remaining: ${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
        
        if (timeLeft <= 0) {
            clearInterval(countdown);
            alert("Time is up! Submitting your answers.");
            form.submit();
        }
        timeLeft--;
    }, 1000);
</script>
{% endblock %}
