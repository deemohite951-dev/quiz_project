{% extends 'quiz/base.html' %}
{% block content %}
<div class="card border-0 shadow-sm mx-auto p-4" style="max-width: 420px;">
    <h3 class="fw-bold mb-3 text-center">Login</h3>
    <form method="POST">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-primary w-100 mt-2">Sign In</button>
    </form>
    <p class="text-center mt-3 text-muted small">Don't have an account? <a href="{% url 'register' %}">Register here</a></p>
</div>
{% endblock %}
